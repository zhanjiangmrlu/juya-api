# Install as /etc/ssh/sshd_config.d/90-juya-dev-tunnel.conf.
# The dedicated account's authorized_keys must permit the same four loopback listeners.
Match User juya-dev-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:34173 127.0.0.1:38001 127.0.0.1:38002 127.0.0.1:34174
    ClientAliveInterval 15
    ClientAliveCountMax 2
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /bin/false
Match all
