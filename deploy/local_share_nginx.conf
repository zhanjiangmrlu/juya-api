# Dedicated local development ingress. Existing test/production vhosts are separate.
map $http_upgrade $juya_dev_connection {
    default upgrade;
    '' close;
}
log_format juya_dev_safe escape=json
    '{"time":$msec,"environment":"local","method":"$request_method",'
    '"status":$status,"seconds":$request_time,"request_id":"$request_id"}';

server {
    listen 80;
    server_name dev-admin.juyayingyu.com dev-admin-api.juyayingyu.com dev-api.juyayingyu.com;
    access_log /var/log/nginx/juya-dev-access.jsonl juya_dev_safe;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/juya-dev-acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name dev-admin.juyayingyu.com;
    ssl_certificate /etc/letsencrypt/live/juya-dev-local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juya-dev-local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/juya-dev-access.jsonl juya_dev_safe;
    error_log /dev/null crit;
    client_max_body_size 110m;
    client_body_timeout 180s;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    proxy_intercept_errors on;
    error_page 502 504 =503 @offline;
    location /api/admin/v1/ {
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_cookie_flags juya_admin_session secure httponly samesite=strict;
        proxy_pass http://127.0.0.1:38001;
    }
    location /api/ { return 404; }
    location ~ ^/(?:__qa__|docs|redoc|openapi\.json|health)(?:/|$) { return 404; }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $juya_dev_connection;
        proxy_pass http://127.0.0.1:34173;
    }
    location @offline {
        default_type application/json;
        return 503 '{"error":{"code":"local_unavailable","message":"Local development service is offline"}}';
    }
}

